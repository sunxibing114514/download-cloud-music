<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16213e">
<title>网易云音乐下载器</title>
<style>
    * { box-sizing: border-box; }

    html {
        /* 用 CSS 渐变替代已失效的 source.unsplash.com 随机图 */
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 45%, #0f3460 100%);
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow-x: hidden;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    /* ---------- 背景光斑 ---------- */
    body::before,
    body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        opacity: .45;
        z-index: -1;
        pointer-events: none;
    }
    body::before {
        width: 420px; height: 420px;
        top: -140px; left: -120px;
        background: #ff6b6b;
        animation: floatA 16s ease-in-out infinite;
    }
    body::after {
        width: 480px; height: 480px;
        bottom: -180px; right: -140px;
        background: #4facfe;
        animation: floatB 20s ease-in-out infinite;
    }
    @keyframes floatA { 50% { transform: translate(80px, 60px) scale(1.15); } }
    @keyframes floatB { 50% { transform: translate(-90px, -70px) scale(1.1); } }

    /* ---------- 玻璃卡片 ---------- */
    .glass-container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        padding: 34px 26px 26px;
        background: rgba(255, 255, 255, .08);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, .16);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, .35),
                    inset 0 1px 0 rgba(255, 255, 255, .15);
    }

    .logo {
        display: block;
        text-align: center;
        font-size: 38px;
        line-height: 1;
        animation: bounce 2.6s ease-in-out infinite;
    }
    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
    }

    h1 {
        margin: 12px 0 6px;
        text-align: center;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: .5px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    }

    .subtitle {
        margin: 0 0 26px;
        text-align: center;
        font-size: 13px;
        color: rgba(255, 255, 255, .55);
    }

    /* ---------- 输入框 ---------- */
    .input-wrap {
        position: relative;
        margin-bottom: 16px;
    }
    .input-wrap input {
        width: 100%;
        padding: 15px 42px 15px 42px;
        background: rgba(255, 255, 255, .07);
        border: 1px solid rgba(255, 255, 255, .15);
        border-radius: 14px;
        color: #fff;
        font-size: 15px;
        outline: none;
        transition: border-color .25s, background .25s, box-shadow .25s;
    }
    .input-wrap input::placeholder { color: rgba(255, 255, 255, .35); }
    .input-wrap input:focus {
        border-color: rgba(255, 107, 107, .7);
        background: rgba(255, 255, 255, .11);
        box-shadow: 0 0 0 4px rgba(255, 107, 107, .14);
    }

    .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 15px;
        opacity: .55;
        pointer-events: none;
    }

    .clear-btn {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 24px;
        height: 24px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, .15);
        color: #fff;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        transition: background .2s;
    }
    .clear-btn.show { display: flex; }
    .clear-btn:hover { background: rgba(255, 255, 255, .3); }

    /* ---------- 下载按钮 ---------- */
    .download-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #ff6b6b, #ff8e53);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 1px;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(255, 107, 107, .32);
        transition: transform .2s, box-shadow .2s, opacity .2s;
    }
    .download-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(255, 107, 107, .45);
    }
    .download-btn:active:not(:disabled) { transform: translateY(0); }
    .download-btn:disabled { opacity: .7; cursor: not-allowed; }

    .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, .35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin .7s linear infinite;
    }
    .download-btn.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- 帮助链接 ---------- */
    .help-link {
        display: block;
        margin: 18px 0 0;
        text-align: center;
        font-size: 13px;
        color: rgba(255, 255, 255, .55);
        cursor: pointer;
        user-select: none;
        transition: color .2s;
    }
    .help-link:hover { color: #ff8e8e; }

    /* ---------- 抖动动画 ---------- */
    .shake { animation: shake .4s; }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%      { transform: translateX(-8px); }
        40%      { transform: translateX(8px); }
        60%      { transform: translateX(-5px); }
        80%      { transform: translateX(5px); }
    }

    /* ---------- 帮助弹窗 ---------- */
    .help-modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: rgba(10, 10, 22, .6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        opacity: 0;
        visibility: hidden;
        transition: opacity .25s, visibility .25s;
    }
    .help-modal.show { opacity: 1; visibility: visible; }

    .help-content {
        position: relative;
        width: 100%;
        max-width: 460px;
        max-height: 82vh;
        overflow-y: auto;
        padding: 26px 24px;
        background: rgba(32, 34, 54, .92);
        border: 1px solid rgba(255, 255, 255, .15);
        border-radius: 20px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
        transform: translateY(16px) scale(.97);
        transition: transform .3s cubic-bezier(.2, .8, .3, 1.2);
    }
    .help-modal.show .help-content { transform: none; }

    .help-content h2 {
        margin: 0 0 16px;
        font-size: 18px;
        color: #fff;
    }
    .help-content p,
    .help-content li {
        color: rgba(255, 255, 255, .78);
        font-size: 14px;
        line-height: 1.75;
    }
    .help-content ol { margin: 0; padding-left: 20px; }
    .help-content li { margin-bottom: 8px; }

    .help-content code {
        display: block;
        margin: 8px 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, .35);
        color: rgba(255, 255, 255, .7);
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12.5px;
        word-break: break-all;
    }
    .help-content code b { color: #ff8e8e; }

    .tip {
        margin: 16px 0 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, .06);
        font-size: 13px !important;
    }
    .tip.warn { color: #ffbe76 !important; }

    .close-btn {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 32px;
        height: 32px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, .1);
        color: #fff;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background .2s, transform .25s;
    }
    .close-btn:hover {
        background: rgba(255, 255, 255, .22);
        transform: rotate(90deg);
    }

    /* ---------- Toast ---------- */
    .toast {
        position: fixed;
        left: 50%;
        bottom: 40px;
        z-index: 2000;
        max-width: 88vw;
        padding: 12px 22px;
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 12px;
        background: rgba(30, 30, 46, .94);
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 14px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, 20px);
        transition: opacity .3s, transform .3s, visibility .3s;
    }
    .toast.show {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
    }
    .toast.error { border-color: rgba(255, 107, 107, .55); }

    @media (max-width: 420px) {
        .glass-container { padding: 28px 20px 22px; border-radius: 20px; }
        h1 { font-size: 19px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .001ms !important;
            transition-duration: .001ms !important;
        }
    }
</style>
</head>
<body>

<div class="glass-container">
    <span class="logo">🎵</span>
    <h1>音乐下载器</h1>
    <p class="subtitle">输入歌曲 ID 或粘贴链接，一键下载</p>

    <div class="input-wrap" id="inputWrap">
        <span class="input-icon">🔗</span>
        <input type="text" id="songId" placeholder="歌曲 ID / 歌曲链接"
               autocomplete="off" spellcheck="false" aria-label="歌曲 ID 或链接">
        <button class="clear-btn" id="clearBtn" type="button" aria-label="清空">×</button>
    </div>

    <button class="download-btn" id="downloadBtn" type="button">
        <span class="spinner"></span>
        <span class="btn-text">立即下载</span>
    </button>

    <p class="help-link" id="helpLink">如何查看 ID？</p>
</div>

<!-- 帮助弹窗 -->
<div class="help-modal" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="help-content">
        <button class="close-btn" id="closeHelp" type="button" aria-label="关闭">×</button>
        <h2 id="helpTitle">如何获取歌曲 ID</h2>
        <ol>
            <li>打开网易云音乐网页版 <b>music.163.com</b></li>
            <li>找到想要下载的歌曲，进入播放页</li>
            <li>查看浏览器地址栏，URL 格式类似：</li>
        </ol>
        <code>https://music.163.com/#/song?id=<b>33894312</b></code>
        <p>其中 <b style="color:#ff8e8e">33894312</b> 就是歌曲 ID</p>
        <p class="tip">💡 也可以直接把分享链接粘贴到输入框，会自动识别出 ID</p>
        <p class="tip warn">⚠️ 部分歌曲受版权限制，可能无法下载或下载到的是空文件</p>
    </div>
</div>

<!-- 轻提示 -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
    'use strict';

    const input       = document.getElementById('songId');
    const inputWrap   = document.getElementById('inputWrap');
    const clearBtn    = document.getElementById('clearBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const btnText     = downloadBtn.querySelector('.btn-text');
    const helpModal   = document.getElementById('helpModal');
    const helpLink    = document.getElementById('helpLink');
    const closeHelpBtn= document.getElementById('closeHelp');
    const toastEl     = document.getElementById('toast');

    /* ---------------- Toast ---------------- */
    let toastTimer = null;
    function showToast(message, type) {
        clearTimeout(toastTimer);
        toastEl.textContent = message;
        toastEl.className = 'toast show' + (type ? ' ' + type : '');
        toastTimer = setTimeout(function () {
            toastEl.className = 'toast' + (type ? ' ' + type : '');
        }, 2600);
    }

    /* ---------------- 从任意文本中解析歌曲 ID ---------------- */
    function extractSongId(raw) {
        const text = String(raw || '').trim();
        if (!text) return null;

        // 1) 纯数字
        if (/^\d{1,15}$/.test(text)) return text;

        // 2) URL 中的 id=xxx  /  &id=xxx  /  #id=xxx
        let m = text.match(/[?&#]id=(\d{1,15})/);
        if (m) return m[1];

        // 3) 路径形式 /song/123456
        m = text.match(/\/(\d{6,15})(?:[/?#]|$)/);
        if (m) return m[1];

        return null;
    }

    /* ---------------- 输入框辅助 ---------------- */
    function updateClearBtn() {
        clearBtn.classList.toggle('show', input.value.trim().length > 0);
    }

    input.addEventListener('input', updateClearBtn);

    clearBtn.addEventListener('click', function () {
        input.value = '';
        updateClearBtn();
        input.focus();
    });

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            startDownload();
        }
    });

    function shakeInput() {
        inputWrap.classList.remove('shake');
        void inputWrap.offsetWidth; // 触发重排以重启动画
        inputWrap.classList.add('shake');
    }

    /* ---------------- 按钮加载状态 ---------------- */
    let loading = false;
    function setLoading(on) {
        loading = on;
        downloadBtn.disabled = on;
        downloadBtn.classList.toggle('loading', on);
        downloadBtn.setAttribute('aria-busy', on ? 'true' : 'false');
        btnText.textContent = on ? '正在获取…' : '立即下载';
    }

    /* ---------------- 下载逻辑 ---------------- */
    function startDownload() {
        if (loading) return;

        const songId = extractSongId(input.value);

        if (!songId) {
            shakeInput();
            input.focus();
            showToast(
                input.value.trim()
                    ? '无法识别链接中的歌曲 ID'
                    : '请先输入歌曲 ID 或链接',
                'error'
            );
            return;
        }

        // 输入框里是链接时，回填为纯 ID，便于用户确认
        if (input.value.trim() !== songId) {
            input.value = songId;
            updateClearBtn();
        }

        setLoading(true);

        const url = 'https://music.163.com/song/media/outer/url?id=' + encodeURIComponent(songId) + '.mp3';

        // 跨域下载时 download 属性会被浏览器忽略，
        // 但对 audio/mpeg 资源仍会触发下载而不是跳转页面
        const a = document.createElement('a');
        a.href = url;
        a.download = songId + '.mp3';
        a.target = '_blank';
        a.rel = 'noopener';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();

        // 清理 DOM
        setTimeout(function () { a.remove(); }, 1000);

        // 无法真正感知下载完成，这里给一个短反馈
        setTimeout(function () {
            setLoading(false);
            showToast('已开始下载，若长时间无响应请检查歌曲版权');
        }, 1200);
    }

    downloadBtn.addEventListener('click', startDownload);

    /* ---------------- 帮助弹窗 ---------------- */
    function openHelp() {
        helpModal.classList.add('show');
        document.body.style.overflow = 'hidden';
        closeHelpBtn.focus();
    }

    function closeHelp() {
        helpModal.classList.remove('show');
        document.body.style.overflow = '';
        helpLink.focus();
    }

    helpLink.addEventListener('click', openHelp);
    closeHelpBtn.addEventListener('click', closeHelp);

    // 点击遮罩关闭
    helpModal.addEventListener('click', function (e) {
        if (e.target === helpModal) closeHelp();
    });

    // ESC 关闭
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && helpModal.classList.contains('show')) {
            closeHelp();
        }
    });

    /* ---------------- 初始化 ---------------- */
    updateClearBtn();
    // 仅在精确指针设备（桌面端）自动聚焦，避免移动端弹起键盘遮挡
    if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        input.focus();
    }
})();
</script>
</body>
</html>
